<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 200; opacity: 0.1; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.1; }
    }
    .orb-anim1 { animation: pulseOrb 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-anim2 { animation: pulseOrb 11s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .pill-anim1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill-anim2 { animation: floatPill2 7s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 6; animation: dashCycle 2.5s linear infinite; }
    .beam { stroke-dasharray: 60 140; animation: beamFlow 4s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmosphere Orbs -->
  <g class="orb-anim1">
    <circle cx="220" cy="110" r="140" fill="#6366f1" filter="url(#softGlow)" />
  </g>
  <g class="orb-anim2">
    <circle cx="980" cy="290" r="150" fill="#06b6d4" filter="url(#softGlow)" />
  </g>
  <circle cx="600" cy="380" r="110" fill="#8b5cf6" opacity="0.25" filter="url(#softGlow)" />

  <!-- Decorative Tech Grid Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350" />
    <path d="M 150 0 L 150 420 M 300 0 L 300 420 M 450 0 L 450 420 M 600 0 L 600 420 M 750 0 L 750 420 M 900 0 L 900 420 M 1050 0 L 1050 420" />
  </g>

  <!-- Dynamic Data Stream Circuit Lines -->
  <path class="stream-line" d="M 80 340 C 220 340, 260 375, 420 375 S 580 340, 780 340 S 960 375, 1120 375" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path class="stream-line" d="M 80 360 C 240 360, 310 320, 500 320 S 710 360, 920 360 S 1030 330, 1120 330" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" />
  <path class="beam" d="M 120 340 C 350 340, 480 375, 700 375 S 950 340, 1080 340" fill="none" stroke="#a78bfa" stroke-width="3" />

  <!-- Dynamic Side Graphic 1: Invoicing Flow Card (Left) -->
  <g class="pill-anim1" transform="translate(60, 50)">
    <rect width="190" height="92" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="30" r="12" fill="#10b981" opacity="0.2" />
    <path d="M 24 30 L 28 34 L 36 26" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">INVOICE #4092</text>
    <rect x="22" y="54" width="90" height="7" rx="3.5" fill="#475569" />
    <rect x="22" y="67" width="55" height="7" rx="3.5" fill="#334155" />
    <rect x="122" y="52" width="52" height="23" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="148" y="68" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle">PAID</text>
  </g>

  <!-- Dynamic Side Graphic 2: AP Metrics Card (Right) -->
  <g class="pill-anim2" transform="translate(950, 50)">
    <rect width="190" height="92" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="30" r="12" fill="#38bdf8" opacity="0.2" />
    <path d="M 25 33 L 30 27 L 35 33" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">RECURRING ARR</text>
    <text x="22" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20">$124.8K</text>
    <rect x="122" y="52" width="52" height="23" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="148" y="68" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle">+32%</text>
  </g>

  <!-- Center Foreground Content: High-contrast Title, Subtitle, and Feature Tags -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 72)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <circle cx="-135" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="2" text-anchor="middle">CURATED FINTECH &amp; BILLING ARCHITECTURE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="162" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5" text-anchor="middle" filter="url(#glow)">Awesome Automated Invoicing</text>
  <text x="600" y="215" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" text-anchor="middle">&amp; Subscription Billing</text>

  <!-- Subtitle -->
  <text x="600" y="258" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" text-anchor="middle">
    A curated index of enterprise AP automation engines, SaaS billing stacks &amp; open-source metering infrastructure
  </text>

  <!-- Pills Row (Foreground) -->
  <g transform="translate(600, 298)">
    <!-- Pill 1: E-Invoicing -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="72" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" text-anchor="middle">⚡ E-Invoicing</text>
    </g>
    <!-- Pill 2: AP Automation -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="72" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" text-anchor="middle">📑 AP Automation</text>
    </g>
    <!-- Pill 3: Usage Metering -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="75" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" text-anchor="middle">📊 Usage Metering</text>
    </g>
    <!-- Pill 4: Open Source -->
    <g transform="translate(165, 0)">
      <rect x="0" y="0" width="155" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="77" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" text-anchor="middle">🚀 Open-Source OSS</text>
    </g>
  </g>
</svg>
